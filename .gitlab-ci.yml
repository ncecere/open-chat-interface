# GitLab CI for Open Chat Interface.
#
# Stages run cheapest-first so a formatting slip fails in seconds rather than
# after a container build. Images are published only from the default branch and
# tags, so merge requests still get a build check without polluting the registry.

# GitLab's managed SAST template selects the analyzers that support this
# TypeScript/JavaScript repository and publishes findings to merge requests and
# the project's Security & Compliance views.
include:
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - verify
  - test
  - build

default:
  image: node:22-alpine
  interruptible: true

variables:
  # Keeps the pnpm store inside the project so it can be cached between jobs.
  PNPM_STORE: .pnpm-store
  # Test-only values. Real deployments supply their own secrets.
  POSTGRES_DB: oci_ci
  POSTGRES_USER: oci
  POSTGRES_PASSWORD: oci_ci_password
  AUTH_SECRET: ci_auth_secret_with_at_least_32_characters
  ENCRYPTION_KEY: ci_encryption_key_with_at_least_32_chars

.node:
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.18.0 --activate
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile
  cache:
    # Keyed on the lockfile so a dependency change invalidates the store.
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - $PNPM_STORE
    policy: pull-push

lint:
  stage: verify
  extends: .node
  script:
    - pnpm lint

typecheck:
  stage: verify
  extends: .node
  script:
    - pnpm typecheck

audit:
  stage: verify
  extends: .node
  script:
    # Production dependencies only; dev tooling is not shipped.
    - pnpm audit --prod
  allow_failure: true

test:
  stage: test
  extends: .node
  services:
    # The resumable-stream suite skips without Redis; provide it so it runs.
    - name: redis:7-alpine
      alias: redis
  variables:
    TEST_REDIS_URL: redis://redis:6379
  script:
    - pnpm test

# Exercises real migrations, object storage, and SMTP. Suites skip themselves
# when a service is unreachable, so this cannot fail for infrastructure reasons
# alone, but the services below mean it should not have to.
test:live:
  stage: test
  extends: .node
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: minio/minio:RELEASE.2025-09-07T16-13-09Z
      alias: minio
      command: ['server', '/data']
    - name: axllent/mailpit:latest
      alias: mailpit
    - name: redis:7-alpine
      alias: redis
  variables:
    DATABASE_URL: postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
    TEST_REDIS_URL: redis://redis:6379
    TEST_DATABASE_URL: postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
    MINIO_ROOT_USER: ocitest
    MINIO_ROOT_PASSWORD: ocitestsecret
    S3_TEST_ENDPOINT: http://minio:9000
    SMTP_TEST_HOST: mailpit
    MAILPIT_API_URL: http://mailpit:8025
  script:
    # Direct package tests resolve workspace exports from dist on a fresh clone.
    - pnpm --filter @oci/shared build
    - pnpm --filter @oci/db build
    # Coverage runs here because the per-file floors assume the live suites,
    # which exercise the attachment and share paths.
    - pnpm --filter @oci/api test:coverage
  coverage: '/All files\s+\|\s+([\d.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/api/coverage
    reports:
      coverage_report:
        coverage_format: cobertura
        path: apps/api/coverage/cobertura-coverage.xml

# WCAG 2.2 AA scan plus the keyboard checks automation can cover. Needs a
# running app, so it starts the API and web preview against live services.
test:a11y:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  services:
    - name: postgres:17-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    DATABASE_URL: postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
    REDIS_URL: redis://redis:6379
    APP_URL: http://127.0.0.1:4173
    E2E_BASE_URL: http://127.0.0.1:4173
    VITE_API_PROXY: http://127.0.0.1:3000
    INITIAL_ADMIN_EMAIL: admin@example.com
    INITIAL_ADMIN_PASSWORD: ci-admin-password-1234
    E2E_ADMIN_EMAIL: admin@example.com
    E2E_ADMIN_PASSWORD: ci-admin-password-1234
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.18.0 --activate
    - pnpm config set store-dir "$PNPM_STORE"
    - pnpm install --frozen-lockfile
    # Workspace package exports point at dist, which is absent in a clean job.
    - pnpm --filter @oci/shared build
    - pnpm --filter @oci/db build
    - pnpm db:migrate
    - pnpm db:seed
    - pnpm --filter @oci/api build && node apps/api/dist/server.js &
    - pnpm --filter @oci/web build
    - pnpm --filter @oci/web exec vite preview --port 4173 --host 127.0.0.1 &
    # Wait for both services rather than racing them.
    - npx --yes wait-on http://127.0.0.1:3000/api/health/ready http://127.0.0.1:4173
  script:
    - pnpm test:e2e
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - apps/web/test-results
      - apps/web/playwright-report

build:images:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: '/certs/client'
  before_script:
    - docker info >/dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f docker/api.Dockerfile -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA" .
    - docker build -f docker/web.Dockerfile -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" .
    # Only publish from the default branch and tags; merge requests still get
    # the build as a check without pushing anything.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        TAG="${CI_COMMIT_TAG:-latest}"
        for app in api web; do
          docker tag "$CI_REGISTRY_IMAGE/$app:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/$app:$TAG"
          docker push "$CI_REGISTRY_IMAGE/$app:$CI_COMMIT_SHORT_SHA"
          docker push "$CI_REGISTRY_IMAGE/$app:$TAG"
        done
      else
        echo "Merge request build only; images are not published."
      fi
