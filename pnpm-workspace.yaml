packages:
  - apps/*
  - packages/*

overrides:
  esbuild@<=0.24.2: 0.25.0
  # Security baseline: patch vulnerable 0.8.x XML parsers without downgrading newer safe versions.
  '@xmldom/xmldom@>=0.8.0 <0.8.15': '0.8.15'
  # Security baseline: patch vulnerable 3.x ID generators without downgrading newer safe versions.
  'nanoid@>=3.0.0 <3.3.18': '3.3.18'
  # Patch SDK transport and Markdown dependencies without changing SDK majors or newer safe versions.
  'undici@>=7.0.0 <7.29.1': '7.29.1'
  'dompurify@>=3.0.0 <3.4.16': '3.4.16'
  # GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr: pptxgenjs declares image-size but never loads it,
  # and OCI adds no images to presentations; the patched major is safe to substitute.
  'image-size@>=0.6.3 <2.0.3': '2.0.3'
  # GHSA-w5hq-g745-h8pq: exceljs (tests only) requires uuid 8 and calls only v4; 11.1.1 is the
  # patched release that still provides the CommonJS export exceljs loads.
  'uuid@<11.1.1': '11.1.1'

allowBuilds:
  esbuild: true
  '@biomejs/biome': true
  '@tailwindcss/oxide': true
  sharp: true

minimumReleaseAgeExclude:
  - tsx@4.23.9
  - '@ai-sdk/anthropic@4.0.33'
  - '@ai-sdk/gateway@4.0.43'
  - '@ai-sdk/google@4.0.36'
  - '@ai-sdk/openai-compatible@3.0.25'
  - '@ai-sdk/openai@4.0.33'
  - '@ai-sdk/provider-utils@5.0.23'
  - '@ai-sdk/provider@4.0.6'
  - ai@7.0.55
  - '@tanstack/history@1.162.1'
  - '@tanstack/react-router@1.170.21'
  - '@tanstack/router-core@1.171.18'
  - lucide-react@1.29.0
  - vite@8.2.1
  - '@ai-sdk/mcp@2.0.27'
  - '@ai-sdk/react@4.0.58'
  - '@aws-sdk/client-s3@3.1105.0'

patchedDependencies:
  postgres@3.4.9: patches/postgres@3.4.9.patch
