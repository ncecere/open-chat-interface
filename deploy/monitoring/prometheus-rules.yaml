# Open Chat Interface: service objectives and alerts (docs/dev/slo.md).
#
# A Prometheus rule file: list it under `rule_files` (Compose, VMs), or let
# the Helm chart render the same rules as a PrometheusRule
# (`metrics.prometheusRule.enabled`; the chart's copy is
# deploy/helm/open-chat-interface/files/prometheus-rules.yaml and CI checks
# the two are identical). Checked with `promtool check rules` and unit-tested
# with `promtool test rules prometheus-rules.test.yaml`.
#
# Conventions:
# - Series are grouped by `namespace` and `job` (Kubernetes adds `namespace`;
#   elsewhere it is empty and harmless), so several OCI instances can share a
#   Prometheus. The API and worker are separate jobs under the chart.
# - OCI's own `job` label on job metrics (`oci_job_runs_total`,
#   `oci_job_last_success_timestamp_seconds`) collides with Prometheus's
#   target label, so it is stored as `exported_job` (the default
#   `honor_labels: false`). With `honor_labels: true`, replace `exported_job`
#   with `job` below.
# - Classic histogram buckets are matched as `le=~"1(\\.0)?"`: Prometheus 3
#   stores `le="1"` as `le="1.0"`.
# - severity: critical pages someone; warning opens a ticket.

groups:
  # --- Service level indicators -------------------------------------------
  # Each SLI as the share of bad events over 5m, 30m, 1h and 6h: the windows
  # of the multi-window, multi-burn-rate alerts below.
  - name: oci-slo-sli
    interval: 30s
    rules:
      # Availability: API requests answered with a 5xx, of all API requests.
      # Health probes, /metrics and unmatched paths are not user traffic. A
      # 503 a draining replica sends before reading a new turn is never
      # counted (it is answered before routing; the client sends it again).
      - record: oci_slo:availability_errors:ratio_rate5m
        expr: |
          (
            sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched", status=~"5.."}[5m]))
            or sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[5m])) * 0
          )
          / sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[5m]))
      - record: oci_slo:availability_errors:ratio_rate30m
        expr: |
          (
            sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched", status=~"5.."}[30m]))
            or sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[30m])) * 0
          )
          / sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[30m]))
      - record: oci_slo:availability_errors:ratio_rate1h
        expr: |
          (
            sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched", status=~"5.."}[1h]))
            or sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[1h])) * 0
          )
          / sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[1h]))
      - record: oci_slo:availability_errors:ratio_rate6h
        expr: |
          (
            sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched", status=~"5.."}[6h]))
            or sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[6h])) * 0
          )
          / sum by (namespace, job) (rate(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[6h]))

      # Reply start added by OCI: replies whose first model request left
      # more than 1 s after the request arrived (capacity wait excluded).
      - record: oci_slo:reply_start_slow:ratio_rate5m
        expr: |
          1 - sum by (namespace, job) (rate(oci_chat_reply_start_seconds_bucket{le=~"1(\\.0)?"}[5m]))
            / sum by (namespace, job) (rate(oci_chat_reply_start_seconds_count[5m]))
      - record: oci_slo:reply_start_slow:ratio_rate30m
        expr: |
          1 - sum by (namespace, job) (rate(oci_chat_reply_start_seconds_bucket{le=~"1(\\.0)?"}[30m]))
            / sum by (namespace, job) (rate(oci_chat_reply_start_seconds_count[30m]))
      - record: oci_slo:reply_start_slow:ratio_rate1h
        expr: |
          1 - sum by (namespace, job) (rate(oci_chat_reply_start_seconds_bucket{le=~"1(\\.0)?"}[1h]))
            / sum by (namespace, job) (rate(oci_chat_reply_start_seconds_count[1h]))
      - record: oci_slo:reply_start_slow:ratio_rate6h
        expr: |
          1 - sum by (namespace, job) (rate(oci_chat_reply_start_seconds_bucket{le=~"1(\\.0)?"}[6h]))
            / sum by (namespace, job) (rate(oci_chat_reply_start_seconds_count[6h]))

      # Sidebar and conversation opening: the sidebar's requests and the
      # conversation's messages taking more than 300 ms to answer.
      - record: oci_slo:browse_slow:ratio_rate5m
        expr: |
          1 - sum by (namespace, job) (rate(oci_http_request_duration_seconds_bucket{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages", le="0.3"}[5m]))
            / sum by (namespace, job) (rate(oci_http_request_duration_seconds_count{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages"}[5m]))
      - record: oci_slo:browse_slow:ratio_rate30m
        expr: |
          1 - sum by (namespace, job) (rate(oci_http_request_duration_seconds_bucket{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages", le="0.3"}[30m]))
            / sum by (namespace, job) (rate(oci_http_request_duration_seconds_count{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages"}[30m]))
      - record: oci_slo:browse_slow:ratio_rate1h
        expr: |
          1 - sum by (namespace, job) (rate(oci_http_request_duration_seconds_bucket{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages", le="0.3"}[1h]))
            / sum by (namespace, job) (rate(oci_http_request_duration_seconds_count{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages"}[1h]))
      - record: oci_slo:browse_slow:ratio_rate6h
        expr: |
          1 - sum by (namespace, job) (rate(oci_http_request_duration_seconds_bucket{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages", le="0.3"}[6h]))
            / sum by (namespace, job) (rate(oci_http_request_duration_seconds_count{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages"}[6h]))

      # Conversation search taking more than 1 s.
      - record: oci_slo:search_slow:ratio_rate5m
        expr: |
          1 - sum by (namespace, job) (rate(oci_http_request_duration_seconds_bucket{method="GET", route="/api/threads/search", le=~"1(\\.0)?"}[5m]))
            / sum by (namespace, job) (rate(oci_http_request_duration_seconds_count{method="GET", route="/api/threads/search"}[5m]))
      - record: oci_slo:search_slow:ratio_rate30m
        expr: |
          1 - sum by (namespace, job) (rate(oci_http_request_duration_seconds_bucket{method="GET", route="/api/threads/search", le=~"1(\\.0)?"}[30m]))
            / sum by (namespace, job) (rate(oci_http_request_duration_seconds_count{method="GET", route="/api/threads/search"}[30m]))
      - record: oci_slo:search_slow:ratio_rate1h
        expr: |
          1 - sum by (namespace, job) (rate(oci_http_request_duration_seconds_bucket{method="GET", route="/api/threads/search", le=~"1(\\.0)?"}[1h]))
            / sum by (namespace, job) (rate(oci_http_request_duration_seconds_count{method="GET", route="/api/threads/search"}[1h]))
      - record: oci_slo:search_slow:ratio_rate6h
        expr: |
          1 - sum by (namespace, job) (rate(oci_http_request_duration_seconds_bucket{method="GET", route="/api/threads/search", le=~"1(\\.0)?"}[6h]))
            / sum by (namespace, job) (rate(oci_http_request_duration_seconds_count{method="GET", route="/api/threads/search"}[6h]))

  # --- Burn-rate alerts ---------------------------------------------------
  # Multi-window, multi-burn-rate (Google SRE workbook, "Alerting on SLOs"):
  # fast burn pages when the last hour (and, so it resets quickly, the last
  # 5 minutes) spend the budget 14.4 times too fast: 2 % of a 30-day budget
  # in an hour. Slow burn opens a ticket at 6 times over 6 hours (and the
  # last 30 minutes): 5 % in six hours. Budgets: availability 0.1 % of
  # requests (99.9 %); each latency objective 5 % of events (p95).
  # Each needs some traffic (20 events in the long window), so one slow
  # request on a quiet instance pages nobody.
  - name: oci-slo-alerts
    rules:
      - alert: OciAvailabilityBudgetFastBurn
        expr: |
          oci_slo:availability_errors:ratio_rate1h > (14.4 * 0.001)
          and oci_slo:availability_errors:ratio_rate5m > (14.4 * 0.001)
          and on (namespace, job) sum by (namespace, job) (increase(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[1h])) >= 20
        for: 2m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: OCI is answering API requests with server errors
          description: '{{ $value | humanizePercentage }} of API requests in the last hour failed with a 5xx (objective: 99.9 % succeed). At this rate a month''s error budget lasts about two days.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#availability
      - alert: OciAvailabilityBudgetSlowBurn
        expr: |
          oci_slo:availability_errors:ratio_rate6h > (6 * 0.001)
          and oci_slo:availability_errors:ratio_rate30m > (6 * 0.001)
          and on (namespace, job) sum by (namespace, job) (increase(oci_http_requests_total{route!~"/api/health/.*|/metrics|unmatched"}[6h])) >= 20
        for: 15m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: OCI's server errors are using up the availability budget
          description: '{{ $value | humanizePercentage }} of API requests in the last 6 hours failed with a 5xx (objective: 99.9 % succeed).'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#availability

      - alert: OciReplyStartBudgetFastBurn
        expr: |
          oci_slo:reply_start_slow:ratio_rate1h > (14.4 * 0.05)
          and oci_slo:reply_start_slow:ratio_rate5m > (14.4 * 0.05)
          and on (namespace, job) sum by (namespace, job) (increase(oci_chat_reply_start_seconds_count[1h])) >= 20
        for: 2m
        labels:
          severity: critical
          slo: reply-start
        annotations:
          summary: Replies take OCI more than a second to start
          description: '{{ $value | humanizePercentage }} of replies in the last hour waited over 1 s for OCI before the model was asked (objective: 95 % within 1 s; the provider''s own time and capacity waits are not included).'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#reply-start-added-by-oci
      - alert: OciReplyStartBudgetSlowBurn
        expr: |
          oci_slo:reply_start_slow:ratio_rate6h > (6 * 0.05)
          and oci_slo:reply_start_slow:ratio_rate30m > (6 * 0.05)
          and on (namespace, job) sum by (namespace, job) (increase(oci_chat_reply_start_seconds_count[6h])) >= 20
        for: 15m
        labels:
          severity: warning
          slo: reply-start
        annotations:
          summary: Replies are slow to start
          description: '{{ $value | humanizePercentage }} of replies in the last 6 hours waited over 1 s for OCI before the model was asked (objective: 95 % within 1 s).'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#reply-start-added-by-oci

      - alert: OciBrowseBudgetFastBurn
        expr: |
          oci_slo:browse_slow:ratio_rate1h > (14.4 * 0.05)
          and oci_slo:browse_slow:ratio_rate5m > (14.4 * 0.05)
          and on (namespace, job) sum by (namespace, job) (increase(oci_http_request_duration_seconds_count{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages"}[1h])) >= 20
        for: 2m
        labels:
          severity: critical
          slo: browse
        annotations:
          summary: The sidebar and conversations are slow to open
          description: '{{ $value | humanizePercentage }} of sidebar and conversation requests in the last hour took over 300 ms (objective: 95 % within 300 ms).'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#sidebar-and-conversation-opening
      - alert: OciBrowseBudgetSlowBurn
        expr: |
          oci_slo:browse_slow:ratio_rate6h > (6 * 0.05)
          and oci_slo:browse_slow:ratio_rate30m > (6 * 0.05)
          and on (namespace, job) sum by (namespace, job) (increase(oci_http_request_duration_seconds_count{method="GET", route=~"/api/me|/api/threads|/api/models|/api/projects/sidebar|/api/chat/:threadId/messages"}[6h])) >= 20
        for: 15m
        labels:
          severity: warning
          slo: browse
        annotations:
          summary: The sidebar and conversations are getting slow to open
          description: '{{ $value | humanizePercentage }} of sidebar and conversation requests in the last 6 hours took over 300 ms (objective: 95 % within 300 ms).'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#sidebar-and-conversation-opening

      - alert: OciSearchBudgetFastBurn
        expr: |
          oci_slo:search_slow:ratio_rate1h > (14.4 * 0.05)
          and oci_slo:search_slow:ratio_rate5m > (14.4 * 0.05)
          and on (namespace, job) sum by (namespace, job) (increase(oci_http_request_duration_seconds_count{method="GET", route="/api/threads/search"}[1h])) >= 20
        for: 2m
        labels:
          severity: critical
          slo: search
        annotations:
          summary: Conversation search is slow
          description: '{{ $value | humanizePercentage }} of searches in the last hour took over 1 s (objective: 95 % within 1 s).'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#search
      - alert: OciSearchBudgetSlowBurn
        expr: |
          oci_slo:search_slow:ratio_rate6h > (6 * 0.05)
          and oci_slo:search_slow:ratio_rate30m > (6 * 0.05)
          and on (namespace, job) sum by (namespace, job) (increase(oci_http_request_duration_seconds_count{method="GET", route="/api/threads/search"}[6h])) >= 20
        for: 15m
        labels:
          severity: warning
          slo: search
        annotations:
          summary: Conversation search is getting slow
          description: '{{ $value | humanizePercentage }} of searches in the last 6 hours took over 1 s (objective: 95 % within 1 s).'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#search

  # --- Operations ------------------------------------------------------------
  # Causes rather than symptoms: each points at something to fix before it
  # spends an objective's budget. Thresholds are starting points; tune them
  # to your instance (docs/dev/slo.md, "Alerts").
  - name: oci-operations
    rules:
      # Database ---------------------------------------------------------------
      - alert: OciDatabasePoolSaturated
        expr: |
          sum by (namespace, job, instance) (oci_database_connections{state=~"active|idle in transaction"})
            / on (namespace, job, instance) max by (namespace, job, instance) (oci_database_pool_max)
            > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A replica is using nearly all of its database connections
          description: '{{ $labels.instance }} has {{ $value | humanizePercentage }} of DATABASE_POOL_MAX busy. Requests queue for a connection: add replicas, raise DATABASE_POOL_MAX (within the server''s max_connections) or find the slow queries.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#database
      - alert: OciDatabaseSlowToAnswer
        expr: avg_over_time(oci_database_probe_seconds[10m]) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A trivial query waits for the database
          description: '`select 1` through the application pool of {{ $labels.instance }} took {{ $value | humanizeDuration }} on average over 10 minutes: the pool is saturated or the server is overloaded.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#database
      - alert: OciDatabaseReplicationLag
        expr: max by (namespace) (oci_database_replication_lag_seconds) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A PostgreSQL standby is behind the primary
          description: 'The largest standby lag is {{ $value | humanizeDuration }}. A failover now would lose that much; heavy administrative reads have moved back to the primary and background migrations pause.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#database

      # Background work ----------------------------------------------------------
      - alert: OciNoBackgroundWorker
        expr: max by (namespace) (oci_background_workers_alive) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No replica runs background jobs
          description: 'No worker or all replica has checked in for 5 minutes: imports, embeddings, summaries, webhooks, backups, retention and usage rollups have stopped. Start a replica with OCI_ROLE=worker (or all).'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#background-work
      - alert: OciBackgroundJobsNotRunning
        expr: sum by (namespace) (increase(oci_job_runs_total{exported_job="chat.recover-interrupted-replies"}[10m])) < 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Background jobs have stopped running
          description: 'The 15-second sweep has not run for 10 minutes although its metric exists: workers are up but their job runner is stuck, or cannot take its lock.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#background-work
      - alert: OciBackgroundJobFailing
        expr: |
          sum by (namespace, exported_job) (increase(oci_job_runs_total{outcome="error"}[30m])) >= 3
          unless sum by (namespace, exported_job) (increase(oci_job_runs_total{outcome="success"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Background job {{ $labels.exported_job }} keeps failing'
          description: 'It failed {{ $value }} times in 30 minutes without succeeding. Its error is on System health and in the API log.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#background-work
      - alert: OciQueueBacklog
        expr: |
          max by (namespace, queue) (oci_queue_depth{queue="conversation_imports"}) > 20
          or max by (namespace, queue) (oci_queue_depth{queue="compaction"}) > 200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Work is piling up in the {{ $labels.queue }} queue'
          description: '{{ $value }} items have been waiting for 30 minutes. Check that a worker runs and its jobs succeed; add workers if they are busy.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#background-work
      - alert: OciWebhookBacklog
        expr: max by (namespace) (oci_webhook_deliveries_pending) > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Webhook deliveries are piling up
          description: '{{ $value }} deliveries are waiting: an endpoint is failing or webhooks.deliver is not running.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#background-work
      - alert: OciStorageDeletionBacklog
        expr: max by (namespace) (oci_storage_deletions_pending) > 10000
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Stored objects are not being deleted
          description: '{{ $value }} objects are queued for deletion: check storage credentials and storage.drain-deleted-objects.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#background-work
      - alert: OciBackgroundMigrationFailed
        expr: max by (namespace, migration) (oci_background_migration_status{status="failed"}) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Background migration {{ $labels.migration }} failed'
          description: It stopped after five failures in a row. Its error is on System health, Background migrations; resume it there once the cause is fixed. A later release may require it to finish.
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#background-work
      - alert: OciBackgroundMigrationStalled
        expr: |
          max by (namespace, migration) (oci_background_migration_status{status="running"}) == 1
          and on (namespace, migration)
          max by (namespace, migration) (changes(oci_background_migration_rows_processed[1h])) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Background migration {{ $labels.migration }} has made no progress for an hour'
          description: 'It is running but processed no row. It may be throttled (replication lag, a long transaction; System health shows why) or no worker runs it.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#background-work
      - alert: OciUsageRollupBacklog
        expr: max by (namespace) (oci_queue_depth{queue="usage_rollup_changes"}) > 50000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Usage changes are not being folded into the rollups
          description: '{{ $value }} usage changes wait to be folded. Usage pages and budget checks stay exact but read more rows each time; check usage.fold-rollups.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#usage-and-quota
      - alert: OciUsageRollupFoldStale
        expr: time() - max by (namespace) (oci_job_last_success_timestamp_seconds{exported_job="usage.fold-rollups"}) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The usage rollup fold has not succeeded for 15 minutes
          description: usage.fold-rollups runs every 30 seconds on workers. Its last success was {{ $value | humanizeDuration }} ago.
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#usage-and-quota
      - alert: OciBackupStale
        expr: time() - max by (namespace) (oci_backup_last_success_timestamp_seconds) > 26 * 3600
        labels:
          severity: warning
        annotations:
          summary: No successful backup in over a day
          description: The last successful backup finished {{ $value | humanizeDuration }} ago.
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#background-work

      # Model providers -----------------------------------------------------------
      - alert: OciReplyErrors
        expr: |
          sum by (namespace) (rate(oci_chat_replies_total{status="error"}[15m]))
            / sum by (namespace) (rate(oci_chat_replies_total[15m])) > 0.05
          and on (namespace) sum by (namespace) (increase(oci_chat_replies_total[15m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Replies are failing
          description: '{{ $value | humanizePercentage }} of replies in 15 minutes ended in an error, usually the model provider''s. See which provider in oci_provider_throttled_total and the API log.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#model-providers
      - alert: OciProviderThrottling
        expr: sum by (namespace, provider) (rate(oci_provider_throttled_total{status="429"}[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.provider }} keeps refusing requests with 429'
          description: 'The provider asked OCI to slow down {{ $value | humanize }} times a second. Set or lower its limits under Providers & Models so turns queue instead.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#model-providers
      - alert: OciProviderSlowFirstOutput
        expr: |
          histogram_quantile(0.95, sum by (namespace, provider, model, le) (rate(oci_provider_first_output_seconds_bucket[15m]))) > 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.model }} at {{ $labels.provider }} is slow to start replying'
          description: 'p95 time from request to first output is {{ $value | humanizeDuration }}. This is the provider''s latency, outside OCI''s objectives.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#model-providers
      - alert: OciProviderQueueWaits
        expr: |
          histogram_quantile(0.95, sum by (namespace, provider, model, le) (rate(oci_provider_queue_wait_seconds_bucket[15m]))) > 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Turns wait long for {{ $labels.model }} capacity'
          description: 'p95 wait for provider capacity is {{ $value | humanizeDuration }}. Raise the provider''s limits if its plan allows, or steer people to another model.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#model-providers
      - alert: OciProviderQueueTimeouts
        expr: sum by (namespace, provider) (increase(oci_provider_queue_waits_total{outcome="timeout"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Messages give up waiting for {{ $labels.provider }}'
          description: '{{ $value | humanize }} turns waited past the maximum queue wait in 15 minutes and failed with "model is busy".'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#model-providers

      # Redis, readiness and draining ------------------------------------------------
      - alert: OciRedisUnavailable
        expr: max by (namespace) (oci_redis_up) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redis is unavailable to every replica
          description: Replies cannot be resumed after a disconnect, and rate limits and concurrency caps count per replica, until Redis is back.
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#redis-readiness-and-draining
      - alert: OciRedisUnavailableOnReplica
        expr: oci_redis_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }} cannot reach Redis'
          description: Other replicas can; check this replica's network path and REDIS_* settings.
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#redis-readiness-and-draining
      - alert: OciReadinessFlapping
        expr: sum by (namespace, job, instance) (increase(oci_readiness_transitions_total{to="not_ready"}[30m])) > 1
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }} keeps going in and out of readiness'
          description: 'Readiness failed {{ $value | humanize }} times in 30 minutes (draining excluded): the database was unreachable for over 30 s each time.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#redis-readiness-and-draining
      - alert: OciRepliesInterruptedByDrain
        expr: |
          max by (namespace) (increase(oci_cluster_drain_interrupted_replies_total[1h])) > 0
          or sum by (namespace) (increase(oci_drain_interrupted_replies_total[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: Replies were cut short by a replica shutting down
          description: 'Replies saved as interrupted in the last hour: about {{ $value | printf "%.0f" }}. They were still running when their replica''s drain limit ran out. Raise SHUTDOWN_DRAIN_TIMEOUT_MS and the termination grace period together.'
          runbook_url: https://github.com/ncecere/open-chat-interface/blob/main/docs/dev/slo.md#redis-readiness-and-draining
