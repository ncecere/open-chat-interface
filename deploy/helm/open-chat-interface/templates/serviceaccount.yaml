{{- if .Values.serviceAccount.create }}
# The application never talks to the Kubernetes API: no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oci.serviceAccountName" . }}
  labels:
    {{- include "oci.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
