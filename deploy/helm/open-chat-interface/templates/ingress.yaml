{{- if .Values.ingress.enabled }}
# Everything, /api included, goes to the web Service: its Caddy is the only
# component that may tell the API a client address.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oci.fullname" . }}
  labels:
    {{- include "oci.labels" (dict "root" . "component" "web") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range (default (list (dict "path" "/" "pathType" "Prefix")) .paths) }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "oci.web.name" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
