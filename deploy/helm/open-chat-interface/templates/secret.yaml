{{- if not .Values.secrets.existingSecret }}
{{- include "oci.validate" . }}
# Evaluation and CI only (secrets.values). Production uses
# secrets.existingSecret. A hook, so it exists before the pre-install
# migration Job; Helm does not delete hook resources on uninstall, which keeps
# AUTH_SECRET and ENCRYPTION_KEY with the database they protect.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oci.secretName" . }}
  labels:
    {{- include "oci.labels" (dict "root" . "component" "runtime") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
