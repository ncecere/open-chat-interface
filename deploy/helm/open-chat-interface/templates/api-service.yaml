apiVersion: v1
kind: Service
metadata:
  name: {{ include "oci.api.name" . }}
  labels:
    {{- include "oci.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "oci.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
---
# The web pods' Caddy resolves this name every 2 s and balances across the
# ready API pods itself, so its passive health checks (a 503 from a draining
# replica, a refused connection) take one pod out of rotation, not the whole
# Service. Only ready pods are published.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oci.apiHeadless.name" . }}
  labels:
    {{- include "oci.labels" (dict "root" . "component" "api") | nindent 4 }}
    open-chat-interface/headless: "true"
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- include "oci.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
