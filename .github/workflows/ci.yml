name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact reviewed release commit to verify
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Application checks
    runs-on: ubuntu-24.04
    # The full run (static checks, coverage with live services, the browser
    # suite) took 22-26 minutes at v0.9.1; leave room as the suites grow.
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: oci_ci
        ports: ['5439:5432']
        options: >-
          --health-cmd "pg_isready -U oci -d oci_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6389:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
        ports: ['1025:1025', '8025:8025']
      # S3 for the storage, backup and compliance-export suites. VersityGW
      # (Apache-2.0) is an S3 gateway over a directory: one small static
      # binary, configured entirely by environment, so it runs as a service.
      # MinIO no longer publishes community images. Object metadata goes to a
      # sidecar directory, so nothing depends on xattr support. Test-only
      # credentials. See docs/dev/testing.md, "S3 in CI".
      s3:
        image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
        env:
          ROOT_ACCESS_KEY: oci_ci_s3
          ROOT_SECRET_KEY: ci-only-s3-secret-key
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          VGW_META_SIDECAR: /meta
          VGW_HEALTH: /health
          VGW_QUIET: 'true'
        ports: ['7070:7070']
        options: >-
          --tmpfs /data --tmpfs /meta
          --health-cmd "wget -q --spider http://127.0.0.1:7070/health"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://oci:ci-only-password@127.0.0.1:5439/oci_ci
      TEST_DATABASE_URL: postgres://oci:ci-only-password@127.0.0.1:5439/oci_ci
      REDIS_URL: redis://127.0.0.1:6389
      TEST_REDIS_URL: redis://127.0.0.1:6389
      AUTH_SECRET: ci-auth-secret-at-least-32-characters
      ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters
      APP_URL: http://127.0.0.1:4173
      E2E_BASE_URL: http://127.0.0.1:4173
      VITE_API_PROXY: http://127.0.0.1:3000
      INITIAL_ADMIN_EMAIL: admin@example.test
      INITIAL_ADMIN_PASSWORD: ci-admin-password-1234
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: ci-admin-password-1234
      # The browser suite signs in far more often than a person would; the
      # sign-in rate limit itself is covered by live tests.
      RATE_LIMIT_AUTH_PER_MINUTE: '100000'
      S3_TEST_ENDPOINT: http://127.0.0.1:7070
      S3_TEST_BUCKET: oci-ci-attachments
      S3_TEST_ACCESS_KEY_ID: oci_ci_s3
      S3_TEST_SECRET_ACCESS_KEY: ci-only-s3-secret-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.0'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm install --frozen-lockfile
      - name: Migration lint
        # Parses every migration with PostgreSQL's parser and fails on new
        # statements that lock or rewrite existing tables (docs/dev/database.md).
        # Read-only: CI never writes scripts/lint-migrations/baseline.json.
        run: pnpm lint:migrations
      - name: Static, dependency and build checks
        run: |
          pnpm release:check
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm licenses:check
          pnpm audit --prod
          pnpm audit
      - name: Unit, integration and release automation tests
        run: |
          pnpm test
          if compgen -G 'scripts/*.test.mjs' > /dev/null; then
            node --test scripts/*.test.mjs
          fi
      - name: PostgreSQL 17 client tools for the backup suite
        # pg_dump must match the server's major version (pgvector/pgvector:pg17),
        # so it comes from the PostgreSQL project's apt repository, its signing
        # key checked against the published fingerprint. The major version is
        # pinned and checked; PGDG keeps only current minor releases, so a
        # minor pin would break the build at the next PostgreSQL release.
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '/^fpr:/ { print $10; exit }')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/pgdg.gpg "$RUNNER_TEMP/pgdg.asc"
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/pgdg.list \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 17\.'
          echo BACKUP_PG_BIN_DIR=/usr/lib/postgresql/17/bin >> "$GITHUB_ENV"
      - name: Coverage with PostgreSQL, Redis, SMTP and S3
        # Every live suite runs, S3 included; with CI set an unreachable S3
        # server fails them rather than skipping, and every floor applies.
        run: pnpm test:coverage
      - name: Browser and accessibility regression tests
        run: |
          pnpm --filter @oci/web exec playwright install --with-deps chromium
          pnpm db:migrate
          pnpm db:seed
          node apps/api/dist/server.js > /tmp/oci-api.log 2>&1 &
          api_pid=$!
          pnpm --filter @oci/web exec vite preview --host 127.0.0.1 --port 4173 > /tmp/oci-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import { setTimeout } from 'node:timers/promises';
          for (const url of ['http://127.0.0.1:3000/api/health/ready', 'http://127.0.0.1:4173']) {
            let ready = false;
            for (let i = 0; i < 60; i++) {
              try { ready = (await fetch(url, { signal: AbortSignal.timeout(1000) })).ok; } catch {}
              if (ready) break;
              await setTimeout(1000);
            }
            if (!ready) throw new Error(`Service did not become ready: ${url}`);
          }
          JS
          E2E_SEEDED=1 pnpm test:e2e
      - name: Browser tests against the deterministic fixture
        # Specs that need the browser-performance fixture (a 2,000-message
        # conversation and a stub model): apps/web/playwright.config.ts,
        # FIXTURE_SPECS.
        run: |
          OCI_BROWSER_FIXTURE=1 TEST_DATABASE_URL="$TEST_DATABASE_URL" \
            pnpm --filter @oci/api exec tsx test/browser-performance/server.ts > /tmp/oci-fixture.log 2>&1 &
          fixture_pid=$!
          VITE_API_PROXY=http://127.0.0.1:4180 \
            pnpm --filter @oci/web exec vite preview --host 127.0.0.1 --port 4178 --strictPort > /tmp/oci-fixture-web.log 2>&1 &
          preview_pid=$!
          trap 'kill "$fixture_pid" "$preview_pid" 2>/dev/null || true' EXIT
          metadata=""
          for i in $(seq 1 120); do
            metadata=$(sed -n 's/^Browser performance fixture ready: //p' /tmp/oci-fixture.log | head -1)
            if test -n "$metadata"; then break; fi
            sleep 1
          done
          if test -z "$metadata"; then cat /tmp/oci-fixture.log; exit 1; fi
          credentials="$(dirname "$metadata")/credentials.json"
          export E2E_ADMIN_EMAIL="$(node -p "require('$credentials').email")"
          export E2E_ADMIN_PASSWORD="$(node -p "require('$credentials').password")"
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          for url in http://127.0.0.1:4180/api/health/ready http://127.0.0.1:4178; do
            for i in $(seq 1 60); do curl -fsS -o /dev/null "$url" && break; sleep 1; done
          done
          # One worker, as locally: the specs share the fixture's one long
          # conversation, and one of them sends a reply into it.
          E2E_BASE_URL=http://127.0.0.1:4178 pnpm --filter @oci/web exec playwright test tests/e2e/long-conversation.spec.ts --workers=1
      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics
          retention-days: 7
          path: |
            apps/api/coverage
            apps/web/test-results
            apps/web/playwright-report
            /tmp/oci-api.log
            /tmp/oci-web.log

  containers:
    name: Build ${{ matrix.app }} (no publication)
    if: github.event_name == 'pull_request' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
