# Deletes old development images (branch-images.yml's dev-<12 hex> tags) from the GHCR packages.
#
# scripts/prune-dev-images.mjs chooses them (tested in scripts/prune-dev-images.test.mjs). Only a
# version whose tags are ALL dev-<12 hex digits> is ever a candidate. Never deleted: untagged versions
# (the per-architecture children of a release's multi-platform index), any version with another tag (a
# release, sha-<short>, latest...), and the image of any branch's head commit, which `dev-env up --ref
# <branch>` pulls. If the branches cannot be listed, nothing is deleted.
#
# Runs weekly and deletes images older than 14 days. By hand it is a dry run unless you clear dry_run,
# and older_than_days below 1 is refused.
name: Prune development images

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      older_than_days:
        description: Delete development images older than this many days
        required: false
        default: '14'
        type: string
      dry_run:
        description: Only list what would be deleted
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: prune-dev-images
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      # URL-encoded package names, one per line
      PACKAGES: |
        open-chat-interface%2Fapi
        open-chat-interface%2Fweb
      OLDER_THAN_DAYS: ${{ inputs.older_than_days || '14' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Prune
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          # Every branch head's image is kept. A failure here stops the job before anything is deleted.
          gh api --paginate "/repos/$REPOSITORY/branches?per_page=100" | jq -s 'add // []' > "$work/branches.json"
          echo "$(jq length "$work/branches.json") branches; dry run: $DRY_RUN"
          deleted=0
          while read -r package; do
            [ -n "$package" ] || continue
            echo "## $package"
            gh api --paginate "/users/$OWNER/packages/container/$package/versions?per_page=100" \
              | jq -s 'add // []' > "$work/versions.json"
            echo "$(jq length "$work/versions.json") versions in the package"
            node scripts/prune-dev-images.mjs --versions "$work/versions.json" \
              --branches "$work/branches.json" --older-than-days "$OLDER_THAN_DAYS" > "$work/candidates.txt"
            while read -r id tags; do
              [ -n "${id:-}" ] || continue
              if [ "$DRY_RUN" = true ]; then
                echo "would delete $id ($tags)"
              else
                gh api -X DELETE "/users/$OWNER/packages/container/$package/versions/$id"
                echo "deleted $id ($tags)"
              fi
              deleted=$((deleted + 1))
            done < "$work/candidates.txt"
          done <<<"$PACKAGES"
          echo "candidates: $deleted (dry run: $DRY_RUN)" | tee -a "$GITHUB_STEP_SUMMARY"
