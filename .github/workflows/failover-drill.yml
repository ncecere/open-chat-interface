name: Failover drill

# A real three-node Patroni cluster (Spilo, etcd, HAProxy) with OCI built from
# this ref in front of it (two API replicas on OCI_ROLE=web, one worker), a
# light load, and `patronictl failover` mid-load and mid-job. Fails on any
# request failure outside the retryable class, a reply left streaming or
# failed, an import that does not finish with every conversation, or jobs
# that do not resume. See docs/dev/failover.md. Builds locally; publishes
# nothing. Pull-request CI covers the same paths with pg_terminate_backend
# (apps/api/src/__tests__/live/failover-*.live.test.ts).

on:
  schedule:
    # Weekly, Monday 05:30 UTC.
    - cron: '30 5 * * 1'
  workflow_dispatch:
    inputs:
      failovers:
        description: How many times to move the primary (a minute apart)
        required: false
        type: number
        default: 2
      import-conversations:
        description: Conversations in the import that is in progress at the first failover
        required: false
        type: number
        default: 5000

permissions:
  contents: read

concurrency:
  group: failover-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    name: Patroni failover under load
    runs-on: ubuntu-24.04
    # About 6-10 minutes: image builds (cached), the cluster, setup, then two
    # failovers a minute apart under load. The limit leaves room for a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.0'
      - name: Source version
        id: source
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image (no publication)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: oci-failover-api:drill
          build-args: |
            OCI_VERSION=${{ steps.source.outputs.version }}
            OCI_REVISION=${{ github.sha }}
          # Reuses the CI workflow's container cache; writes none of its own.
          cache-from: type=gha,scope=api
      - name: Build the web image (no publication)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: oci-failover-web:drill
          build-args: |
            OCI_VERSION=${{ steps.source.outputs.version }}
            OCI_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
      - name: Run the failover drill
        env:
          FAILOVERS: ${{ inputs.failovers || 2 }}
          CONVERSATIONS: ${{ inputs.import-conversations || 5000 }}
        run: |
          node tools/failover-drill/run.mjs \
            --api-image oci-failover-api:drill --web-image oci-failover-web:drill \
            --failovers "$FAILOVERS" --import-conversations "$CONVERSATIONS" \
            --out "$RUNNER_TEMP/failover-drill"
      - name: Summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/failover-drill/report.md"; then
            cat "$RUNNER_TEMP/failover-drill/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failover-drill-report
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/failover-drill
