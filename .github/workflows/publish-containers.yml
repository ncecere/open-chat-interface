name: Publish containers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag on main to publish (for example v0.4.1)
        required: true
        type: string

permissions:
  contents: read

# Serialize publication; never interrupt an in-flight release with a newer one.
concurrency:
  group: ghcr-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      image_root: ${{ steps.release.outputs.image_root }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.0'
      - name: Resolve stable tag and require main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-target.mjs
      - name: Check version and changelog at the actual release commit
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git checkout --detach "$RELEASE_SHA"
          node scripts/prepare-release.mjs --tag "$RELEASE_TAG"

  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read

  publish:
    name: Publish ${{ matrix.app }}
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      # Historical release tags need not contain the new publication scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.0'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push a candidate by digest only
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          file: source/docker/${{ matrix.app }}.Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.prepare.outputs.image_root }}/${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            OCI_VERSION=${{ needs.prepare.outputs.tag }}
            OCI_REVISION=${{ needs.prepare.outputs.sha }}
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_CREATED=${{ needs.prepare.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ needs.prepare.outputs.sha }}/README.md
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: Publish or retain immutable version and SHA tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image_root }}/${{ matrix.app }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node automation/scripts/ghcr-release.mjs

  latest:
    name: Promote latest after both images are available
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: current-main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.0'
      - name: Do not roll latest back for historical dispatches
        id: latest
        working-directory: current-main
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node ../automation/scripts/release-target.mjs latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.latest.outputs.promote == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.latest.outputs.promote == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the verified release digests
        if: steps.latest.outputs.promote == 'true'
        env:
          IMAGE_ROOT: ${{ needs.prepare.outputs.image_root }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for app in api web; do
            IMAGE="$IMAGE_ROOT/$app" node automation/scripts/ghcr-release.mjs latest
          done
      - name: Release summary
        env:
          IMAGE_ROOT: ${{ needs.prepare.outputs.image_root }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PROMOTED: ${{ steps.latest.outputs.promote }}
        run: |
          printf '## Container publication\n\n- %s/api:%s\n- %s/web:%s\n\nLatest promoted: %s\n' \
            "$IMAGE_ROOT" "$RELEASE_TAG" "$IMAGE_ROOT" "$RELEASE_TAG" "$PROMOTED" >> "$GITHUB_STEP_SUMMARY"
