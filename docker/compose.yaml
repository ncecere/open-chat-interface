name: oci

services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:3000
    ports:
      - '${OCI_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:8080}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://oci:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/oci
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      STORAGE_LOCAL_PATH: /data/storage
      # Leave true for a single instance. Set false when the migrate job below
      # owns schema changes, which is the usual pattern once replicas > 1.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - storage_data:/data/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot schema migration for deployments that scale the API. Run it
  # before starting replicas that boot with RUN_MIGRATIONS=false:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    profiles: ['tools']
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://oci:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/oci
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
    command: ['node', 'dist/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: oci
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oci -d oci']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ['s3']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-oci}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-oci_dev_password}
    volumes:
      - minio_data:/data

  searxng:
    image: searxng/searxng:latest
    profiles: ['search']
    restart: unless-stopped
    volumes:
      - searxng_data:/etc/searxng

volumes:
  postgres_data:
  redis_data:
  storage_data:
  minio_data:
  searxng_data:
