name: oci-auth-test

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-oci-keycloak-test-admin}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8090}:8080'
    volumes:
      - ./keycloak/oci-test-realm.json:/opt/keycloak/data/import/oci-test-realm.json:ro
      - keycloak_data:/opt/keycloak/data

  # Captures outbound SMTP so invite, verification, and reset emails can be
  # inspected without delivering to a real mail server.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  # Real S3-compatible storage for the live storage tests. Ports differ from the
  # development compose file (9010/9011) so both stacks can run side by side.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_TEST_ROOT_USER:-oci_test}
      MINIO_ROOT_PASSWORD: ${MINIO_TEST_ROOT_PASSWORD:-oci_test_password}
    ports:
      - '127.0.0.1:${MINIO_TEST_PORT:-9020}:9000'
      - '127.0.0.1:${MINIO_TEST_CONSOLE_PORT:-9021}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio_test_data:/data

  # Creates the test bucket once MinIO is ready, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_TEST_ROOT_USER: ${MINIO_TEST_ROOT_USER:-oci_test}
      MINIO_TEST_ROOT_PASSWORD: ${MINIO_TEST_ROOT_PASSWORD:-oci_test_password}
      MINIO_TEST_BUCKET: ${MINIO_TEST_BUCKET:-oci-test-attachments}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set testminio http://minio:9000
        "$${MINIO_TEST_ROOT_USER}" "$${MINIO_TEST_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "testminio/$${MINIO_TEST_BUCKET}"

volumes:
  keycloak_data:
  minio_test_data:
