# The metrics token shared by the API (METRICS_TOKEN, set with `kubectl set env --from`) and the
# report's collect step (SCALE_METRICS_TOKEN). Generated per run by tools/scale/cluster.sh and piped
# to kubectl on stdin: never on a command line, never printed, never written to results.
apiVersion: v1
kind: Secret
metadata:
  name: ${ENV}-scale-harness
  labels:
    dev.bitop.dev/env: ${ENV}
    app.kubernetes.io/name: scale-harness
type: Opaque
stringData:
  METRICS_TOKEN: "${METRICS_TOKEN}"
