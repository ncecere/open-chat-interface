# HAProxy in front of the drill's Patroni cluster: the usual setup for
# Patroni (https://patroni.readthedocs.io/en/latest/rest_api.html). Every node
# is checked through Patroni's REST API; only the one answering 200 on
# /primary receives connections. `on-marked-down shutdown-sessions` closes
# every client connection to a node as soon as it stops being primary, so the
# application sees its connections drop (as on any failover) instead of
# talking to a demoted node or waiting on a dead one.
global
  maxconn 1000

defaults
  mode tcp
  log global
  retries 2
  timeout connect 2s
  timeout check 2s
  # Idle pooled and LISTEN connections stay open between queries.
  timeout client 30m
  timeout server 30m

listen primary
  bind *:5432
  option httpchk
  http-check send meth GET uri /primary
  http-check expect status 200
  # init-state down: no connection reaches a node before its first check says
  # it is the primary (by default a server starts as up).
  default-server inter 1s fastinter 500ms fall 2 rise 2 init-state down on-marked-down shutdown-sessions
  server pg-1 pg-1:5432 maxconn 300 check port 8008
  server pg-2 pg-2:5432 maxconn 300 check port 8008
  server pg-3 pg-3:5432 maxconn 300 check port 8008
